name: Integration

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iaas
          POSTGRES_PASSWORD: iaas
          POSTGRES_DB: iaas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iaas -d iaas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests (real PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://iaas:iaas@127.0.0.1:5432/iaas?sslmode=disable
        run: go test -tags integration -count=1 -v ./internal/database/
