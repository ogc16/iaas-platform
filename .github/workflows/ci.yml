name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: OpenAPI spec sync
        run: cmp openapi.yaml internal/dashboard/static/openapi.yaml

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Secret scan (gitleaks)
        run: |
          go run github.com/gitleaks/gitleaks/v8@latest detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Dependency audit (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Coverage
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary and gate
        run: |
          go tool cover -func=coverage.out | tail -n 1
          go tool cover -func=coverage.out | awk -F'[[:space:]]+' '/^total:/ {gsub("%","",$3); print "Total coverage: "$3"%"; if ($3+0 < 45) { print "Coverage below the 45% gate"; exit 1 }}'

      - name: Build
        run: go build ./...
