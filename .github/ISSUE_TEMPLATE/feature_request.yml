name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please check [ROADMAP.md](../../ROADMAP.md)
        first — the maintainers have an explicit set of near-term and non-goals.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to accomplish, and why is it hard today?
      placeholder: I want to be able to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API surface you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or existing features that partially cover this.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I would be willing to implement this
        - label: This fits within the project's stated roadmap / non-goals
